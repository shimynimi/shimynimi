project:
  title: "Sentence-Level Affective Content and Regional BOLD Activity During Verbalized Spontaneous Thought"
  status: "proposal_only_empirical_analysis_not_started"
  date_prepared: "2026-11-14"
  protocol_version: "0.2.0"
  preregistered: false

data:
  openneuro_dataset: "ds006067"
  openneuro_version: "2.0.0"
  osf_project: "https://osf.io/a56rm"
  participants_released: 118
  task: "10-minute think-aloud fMRI"
  tr_seconds: 1.5

primary_question: >-
  Within participants, is sentence-level affective content associated with regional
  BOLD activity during verbalized spontaneous thought beyond modeled speech and
  nuisance effects?

predictors:
  primary:
    source_variable: "dataset-defined emotional intensity"
    scale_min: -4
    scale_max: 4
    interpretation: "GPT-5 Nano annotation of verbalized transcript content; signed and valence-like, not subjective emotion or arousal"
    centering: "within_participant"
  exploratory:
    - "sadness"
    - "anxiety"

imaging:
  primary_derivative: "fMRIPrep desc-preproc_bold"
  sensitivity_derivative: "dataset-provided smooth4mm_denoise_bold"
  avoid_double_nuisance_regression: true
  hrf: "canonical double-gamma / SPM-style; implementation to be fixed before confirmatory analysis"
  event_timing: "sentence start/end seconds relative to first functional volume"
  manually_shift_events_4_5_seconds: false
  note: "HRF convolution models hemodynamic delay; do not also apply a fixed 4.5-second event shift in the primary GLM."

quality_control:
  primary_mean_fd_exclusion_mm: 0.5
  primary_mean_fd_status: "provisional; freeze after metadata and feasibility audit, before outcome inspection"
  high_motion_volume_fd_mm: 1.0
  high_motion_buffer_trs_before: 2
  high_motion_buffer_trs_after: 2
  note: >-
    Proposed values follow prior analyses of this dataset and must be checked against
    actual derivative metadata before being frozen. Final sample size is unknown.

rois:
  status: "provisional_atlas_definition_pending_label_and_coverage_validation"
  planned_primary_rois:
    - "Frontal Medial Cortex (operational medial-prefrontal ROI)"
    - "Insular Cortex"
    - "bilateral Amygdala (left + right masks combined)"
  atlas: "Harvard-Oxford maximum-probability cortical and subcortical atlases, 25% threshold"
  record_before_confirmatory_analysis:
    - "atlas name and version"
    - "exact labels and laterality"
    - "mask threshold"
    - "resampling method"
    - "voxel counts and coverage"

statistics:
  first_level:
    regressors:
      - "unmodulated sentence/speech events"
      - "within-participant centered emotional-intensity parametric modulator"
      - "prespecified motion and physiological nuisance terms"
      - "low-frequency drift terms"
    primary_contrast: "emotional-intensity parametric-modulator beta"
  group_level:
    unit: "participant"
    test: "two-sided random-effects / one-sample group model"
    roi_family_fdr_q: 0.05
    report:
      - "final N and exclusion flow"
      - "beta estimates"
      - "95% confidence intervals"
      - "effect sizes"
      - "raw and adjusted p-values"
  sensitivity:
    - "alternative motion criterion"
    - "alternative plausible HRF"
    - "dataset-provided denoised derivative without duplicate regression"
    - "human rating subset (18 transcripts; exploratory only)"

interpretation:
  causal_claims: false
  clinical_mdd_claims: false
  thought_onset_claims: false
  note: >-
    Timestamps identify verbalization, not the onset of the underlying thought.
    GPT-derived ratings describe transcript content, not participants' directly
    reported internal emotional states.
